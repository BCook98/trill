name: Companion release

on:
  push:
    tags: ['v*-build.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    if: github.repository == 'BCook98/trill' && startsWith(github.ref, 'refs/tags/v')
    name: Reuse main validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require successful main checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-require-main-checks.sh

  release:
    needs: validation
    runs-on: macos-15
    environment: companion-release
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: sidecar/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          check-latest: true
      - name: Check immutable tag and public signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import pathlib, re
          team = pathlib.Path('sidecar/distribution/signing-team.txt').read_text().strip()
          if not re.fullmatch(r'[A-Z0-9]{10}', team):
              raise SystemExit('Configure the public signing team before enabling releases')
          PY
      - name: Sign and notarize both architectures
        env:
          COMPANION_SIGNING_CERTIFICATE_BASE64: ${{ secrets.COMPANION_SIGNING_CERTIFICATE_BASE64 }}
          COMPANION_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.COMPANION_SIGNING_CERTIFICATE_PASSWORD }}
          COMPANION_SIGNING_IDENTITY: ${{ vars.COMPANION_SIGNING_IDENTITY }}
          COMPANION_NOTARY_KEY_P8: ${{ secrets.COMPANION_NOTARY_KEY_P8 }}
          COMPANION_NOTARY_KEY_ID: ${{ secrets.COMPANION_NOTARY_KEY_ID }}
          COMPANION_NOTARY_ISSUER_ID: ${{ secrets.COMPANION_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in COMPANION_SIGNING_CERTIFICATE_BASE64 COMPANION_SIGNING_CERTIFICATE_PASSWORD COMPANION_SIGNING_IDENTITY COMPANION_NOTARY_KEY_P8 COMPANION_NOTARY_KEY_ID COMPANION_NOTARY_ISSUER_ID; do
            [[ -n "${!required}" ]] || { echo "Missing $required" >&2; exit 1; }
          done
          umask 077
          signing_directory="$(mktemp -d "$RUNNER_TEMP/trill-signing.XXXXXX")"
          signing_keychain="$signing_directory/signing.keychain-db"
          trap 'security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true; rm -rf -- "$signing_directory"' EXIT
          signing_password="$(openssl rand -hex 32)"
          printf '%s' "$COMPANION_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$signing_directory/certificate.p12"
          printf '%s' "$COMPANION_NOTARY_KEY_P8" > "$signing_directory/notary.p8"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$signing_directory/certificate.p12" -k "$signing_keychain" -P "$COMPANION_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain"
          export COMPANION_NOTARY_KEY_PATH="$signing_directory/notary.p8"
          python3 scripts/build-companion-release.py --output .build/companion-release
      - name: Publish only the complete notarized release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f .build/companion-release/manifest.json
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Trill ${RELEASE_TAG#v}" --notes 'Shared iOS and Mac companion release tag. Signed and notarized companion downloads are attached here; iOS distribution runs through Xcode Cloud/TestFlight. Download install-companion.sh, inspect it, then run it with this exact release tag. Existing signed installations can use trill update. The attached trill.rb is the checksummed Homebrew cask for this release.' .build/companion-release/*.zip .build/companion-release/manifest.json .build/companion-release/install-companion.sh .build/companion-release/trill.rb
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
