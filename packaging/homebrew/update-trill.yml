name: Update Trill cask

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trill-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'BCook98/homebrew-tap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Copy metadata from the latest signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$(gh release list --repo BCook98/trill --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-build\\.[0-9a-f]{12}$")))][0].tagName // empty')"
          [[ -n "$release_tag" ]] || { echo 'No published Trill release found.' >&2; exit 1; }
          mkdir -p Casks
          metadata_directory="$(mktemp -d)"
          trap 'rm -rf -- "$metadata_directory"' EXIT
          gh release download "$release_tag" --repo BCook98/trill --pattern trill.rb --dir "$metadata_directory"
          ruby -c "$metadata_directory/trill.rb"
          cp "$metadata_directory/trill.rb" Casks/trill.rb
          if [[ -n "$(git status --porcelain -- Casks/trill.rb)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Casks/trill.rb
            git commit -m "Update Trill cask to $release_tag"
            git push origin HEAD:main
          fi
